<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Minimalist Neutral Zinc) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>

    <!-- Clean Pages Gradient -->
    <linearGradient id="pageLeftGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d4d4d8" />
      <stop offset="15%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="pageRightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4d4d8" />
      <stop offset="15%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Icon Squircle Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="5" y="5" width="502" height="502" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />

  <!-- Bible & Sermon Outline Composition -->
  <g filter="url(#softShadow)">
    <!-- Cover Base -->
    <path d="M78 340 C146 322 220 326 256 346 C292 326 366 322 434 340 L434 160 C366 142 292 146 256 166 C220 146 146 142 78 160 Z" fill="#09090b" />

    <!-- Pages Base Rim -->
    <path d="M86 348 C150 332 222 336 256 354 C290 336 362 332 426 348 L426 340 C362 324 290 328 256 346 C222 328 150 324 86 340 Z" fill="#71717a" opacity="0.8" />

    <!-- Left Open Page -->
    <path d="M88 336 C152 320 222 324 256 344 L256 158 C222 140 152 136 88 152 Z" fill="url(#pageLeftGrad)" />
    
    <!-- Right Open Page -->
    <path d="M424 336 C360 320 290 324 256 344 L256 158 C290 140 360 136 424 152 Z" fill="url(#pageRightGrad)" />

    <!-- Book Spine Fold Shadow -->
    <path d="M253 158 Q256 344 256 346 Q259 344 259 158 Z" fill="#71717a" opacity="0.4" />

    <!-- Left Page Content: Sacred Scripture Lines -->
    <g opacity="0.75" transform="translate(110, 172)">
      <line x1="0" y1="12" x2="112" y2="12" stroke="#27272a" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="34" x2="112" y2="34" stroke="#71717a" stroke-width="4" stroke-linecap="round" />
      <line x1="0" y1="52" x2="96" y2="52" stroke="#71717a" stroke-width="4" stroke-linecap="round" />
      <line x1="0" y1="70" x2="112" y2="70" stroke="#71717a" stroke-width="4" stroke-linecap="round" />
      <line x1="0" y1="88" x2="76" y2="88" stroke="#71717a" stroke-width="4" stroke-linecap="round" />

      <line x1="0" y1="116" x2="112" y2="116" stroke="#27272a" stroke-width="5.5" stroke-linecap="round" />
      <line x1="0" y1="136" x2="104" y2="136" stroke="#71717a" stroke-width="4" stroke-linecap="round" />
      <line x1="0" y1="154" x2="86" y2="154" stroke="#71717a" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Right Page Content: Structured Homiletic Points -->
    <g transform="translate(286, 176)">
      <!-- Point 1 -->
      <circle cx="8" cy="14" r="5" fill="#18181b" />
      <line x1="24" y1="14" x2="108" y2="14" stroke="#18181b" stroke-width="5.5" stroke-linecap="round" />
      <line x1="24" y1="30" x2="100" y2="30" stroke="#71717a" stroke-width="3.5" stroke-linecap="round" />

      <!-- Point 2 -->
      <circle cx="8" cy="64" r="5" fill="#18181b" />
      <line x1="24" y1="64" x2="112" y2="64" stroke="#18181b" stroke-width="5.5" stroke-linecap="round" />
      <line x1="24" y1="80" x2="92" y2="80" stroke="#71717a" stroke-width="3.5" stroke-linecap="round" />

      <!-- Point 3 -->
      <circle cx="8" cy="114" r="5" fill="#18181b" />
      <line x1="24" y1="114" x2="104" y2="114" stroke="#18181b" stroke-width="5.5" stroke-linecap="round" />
      <line x1="24" y1="130" x2="82" y2="130" stroke="#71717a" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Clean Ribbon Bookmark -->
    <path d="M247 116 L247 250 L256 240 L265 250 L265 116 Z" fill="#52525b" />
  </g>
</svg>
